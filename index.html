<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>时光长河 · 星河恋曲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免拖动图片 */
        }

        body {
            background: #03050b;
            overflow-x: auto;
            overflow-y: hidden;
            font-family: 'Segoe UI', 'Quicksand', 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        /* 星空背景层 */
        .star-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 40%, #0a1030, #010008);
            z-index: -2;
            overflow: hidden;
        }

        /* 动态星星 */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5);}
            100% { opacity: 0.9; transform: scale(1.2);}
        }

        /* 银河光晕背景 */
        .galaxy-glow {
            position: fixed;
            top: 20%;
            left: -20%;
            width: 140%;
            height: 70%;
            background: radial-gradient(ellipse at center, rgba(60,120,200,0.15), rgba(0,0,0,0));
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }

        /* 横向滚动主容器 */
        .river-scroll {
            width: 100%;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            cursor: grab;
            scrollbar-width: thin;
            scrollbar-color: #ffcc88 #1a1f3a;
        }
        .river-scroll:active {
            cursor: grabbing;
        }
        .river-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .river-scroll::-webkit-scrollbar-track {
            background: #1a1f3a;
            border-radius: 10px;
        }
        .river-scroll::-webkit-scrollbar-thumb {
            background: #ffcc88;
            border-radius: 10px;
        }

        /* 河流长卷容器 */
        .river-container {
            position: relative;
            height: 100vh;
            min-width: 100%;
            display: inline-flex;
            align-items: center;
            background: linear-gradient(180deg, 
                rgba(10, 30, 60, 0.4) 0%,
                rgba(20, 60, 100, 0.5) 40%,
                rgba(50, 120, 180, 0.5) 70%,
                rgba(30, 90, 140, 0.4) 100%);
            backdrop-filter: blur(2px);
            box-shadow: inset 0 20px 30px rgba(0,0,0,0.2), inset 0 -20px 30px rgba(0,0,0,0.3);
            border-top: 1px solid rgba(100,200,255,0.5);
            border-bottom: 1px solid rgba(100,200,255,0.4);
        }

        /* 动态流光层 (绝对定位在河流区域) */
        .flowing-lights {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }

        .light-beam {
            position: absolute;
            background: linear-gradient(90deg, 
                rgba(255,220,150,0) 0%,
                rgba(255,200,100,0.6) 30%,
                rgba(255,255,200,0.8) 50%,
                rgba(255,200,100,0.6) 70%,
                rgba(255,220,150,0) 100%);
            width: 180px;
            height: 4px;
            filter: blur(4px);
            border-radius: 50%;
            animation: flowLight 8s linear infinite;
            opacity: 0.7;
        }

        @keyframes flowLight {
            0% {
                transform: translateX(-200px);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(calc(100% + 200px));
                opacity: 0;
            }
        }

        /* 更华丽的光晕粒子 */
        .glow-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #ffdd88, #ffaa55);
            border-radius: 50%;
            filter: blur(1px);
            animation: floatGlow 4s linear infinite;
            opacity: 0.8;
        }

        @keyframes floatGlow {
            0% {
                transform: translateX(-20px) translateY(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateX(calc(100% + 30px)) translateY(20px);
                opacity: 0;
            }
        }

        /* 照片卡片层 (flex 布局) */
        .photo-timeline {
            display: flex;
            gap: 70px;
            padding: 0 100px;
            position: relative;
            z-index: 5;
            align-items: center;
            height: 100%;
        }

        /* 恋人照片卡片 — 精致漂浮 */
        .memory-card {
            flex-shrink: 0;
            width: 280px;
            background: rgba(20, 25, 45, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 12px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,215,150,0.3), 0 0 20px rgba(255,200,100,0.2);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            transform: rotate(0deg) translateY(10px);
            animation: floatCard 4s infinite alternate ease-in-out;
            cursor: pointer;
        }

        .memory-card:nth-child(odd) {
            animation-delay: -1s;
            transform: rotate(-1deg);
        }
        .memory-card:nth-child(even) {
            animation-delay: -2s;
            transform: rotate(1deg);
        }

        @keyframes floatCard {
            0% {
                transform: translateY(8px) rotate(-0.5deg);
            }
            100% {
                transform: translateY(-8px) rotate(0.5deg);
            }
        }

        .memory-card:hover {
            transform: scale(1.08) translateY(-12px) !important;
            box-shadow: 0 30px 45px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,220,120,0.7), 0 0 35px #ffaa55;
            backdrop-filter: blur(8px);
        }

        .memory-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
            display: block;
            transition: transform 0.3s;
            box-shadow: 0 5px 12px rgba(0,0,0,0.3);
        }

        .card-caption {
            text-align: center;
            margin-top: 12px;
            font-size: 1rem;
            color: #fff5e6;
            text-shadow: 0 0 5px #ffaa55;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* 河流装饰 — 水纹波浪 (静态+动态) */
        .river-waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 60px;
            background: repeating-linear-gradient(90deg, 
                rgba(100, 200, 255, 0.2) 0px, 
                rgba(100, 200, 255, 0.2) 2px,
                transparent 2px,
                transparent 12px);
            animation: waveMove 6s linear infinite;
        }

        @keyframes waveMove {
            0% { transform: translateX(0);}
            100% { transform: translateX(-50%);}
        }

        /* 标题与装饰 */
        .river-title {
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffe6c7, #ffb366);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255,180,80,0.6);
            letter-spacing: 6px;
        }

        .sub {
            position: fixed;
            bottom: 20px;
            right: 30px;
            color: #ffddbb;
            font-style: italic;
            z-index: 20;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }

        /* 移动端适配 */
        @media (max-width: 700px) {
            .photo-timeline {
                gap: 40px;
                padding: 0 40px;
            }
            .memory-card {
                width: 220px;
            }
            .memory-card img {
                height: 220px;
            }
            .river-title {
                font-size: 1.4rem;
                top: 12px;
            }
        }
    </style>
</head>
<body>
<div class="star-bg">
    <div class="stars" id="stars"></div>
</div>
<div class="galaxy-glow"></div>

<div class="river-title">? 时 光 长 河 ?</div>
<div class="sub">? 指尖滑动，星河永驻 ?</div>

<div class="river-scroll" id="riverScroll">
    <div class="river-container" id="riverContainer">
        <!-- 动态流光层 -->
        <div class="flowing-lights" id="flowingLights"></div>
        <div class="river-waves">
            <div class="wave" style="bottom: 0; height: 80px; opacity: 0.5;"></div>
            <div class="wave" style="bottom: 20px; height: 40px; animation-duration: 4s; opacity: 0.3;"></div>
        </div>

        <!-- 照片时光轴 -->
        <div class="photo-timeline" id="photoTimeline">
            <!-- 图片将由 js 动态生成，保证灵活性 -->
        </div>
    </div>
</div>

<script>
    // ======================= 恋人合照图片列表（可替换为您自己的图片） =======================
    // 建议使用真实合照链接，这里使用 unsplash 情侣/恋人风格的唯美图片作为示例
    const loveImages = [
        "https://images.pexels.com/photos/2253870/pexels-photo-2253870.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 情侣散步
        "https://images.pexels.com/photos/1074535/pexels-photo-1074535.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 海边拥吻
        "https://images.pexels.com/photos/1036857/pexels-photo-1036857.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 浪漫夕阳
        "https://images.pexels.com/photos/842811/pexels-photo-842811.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",     // 牵手背影
        "https://images.pexels.com/photos/3051226/pexels-photo-3051226.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 情侣自拍
        "https://images.pexels.com/photos/2253870/pexels-photo-2253870.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 重复示例可自行替换
        "https://images.pexels.com/photos/2380794/pexels-photo-2380794.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 城市恋人
        "https://images.pexels.com/photos/1453532/pexels-photo-1453532.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 日落剪影
        "https://images.pexels.com/photos/3128761/pexels-photo-3128761.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 雨中拥吻
        "https://images.pexels.com/photos/1300402/pexels-photo-1300402.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 甜蜜对视
        "https://images.pexels.com/photos/3812752/pexels-photo-3812752.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 秋叶情书
        "https://images.pexels.com/photos/2396938/pexels-photo-2396938.jpeg?auto=compress&cs=tinysrgb&w=400&h=400",   // 摩天轮下
        "https://images.pexels.com/photos/3807734/pexels-photo-3807734.jpeg?auto=compress&cs=tinysrgb&w=400&h=400"    // 依偎
    ];

    // 为了使河流看起来很长，复制多组图片（或者可自定义数量，这里展示20+张让滑动体验明显）
    // 为了增加多样性，可以混排不同的照片描述
    const photoData = [
        { img: loveImages[0], caption: "初遇 · 星河初亮" },
        { img: loveImages[1], caption: "春樱 · 温柔时光" },
        { img: loveImages[2], caption: "盛夏 · 海边誓言" },
        { img: loveImages[3], caption: "秋暮 · 枫叶信笺" },
        { img: loveImages[4], caption: "冬夜 · 彼此温暖" },
        { img: loveImages[5], caption: "第一次旅行 · 山海见证" },
        { img: loveImages[6], caption: "星空下的约定" },
        { img: loveImages[7], caption: "你的笑 · 银河倾落" },
        { img: loveImages[8], caption: "牵手走过四季" },
        { img: loveImages[9], caption: "咖啡店 · 午后情书" },
        { img: loveImages[10], caption: "摩天轮 · 幸福顶点" },
        { img: loveImages[11], caption: "细水长流 · 朝夕相伴" },
        { img: loveImages[12], caption: "永恒 · 星光不灭" },
        { img: loveImages[0], caption: "时光里的我们" },
        { img: loveImages[2], caption: "海风吹过发梢" },
        { img: loveImages[4], caption: "烟火下的约定" },
        { img: loveImages[6], caption: "并肩看世界" },
        { img: loveImages[8], caption: "平凡日常 · 最暖" },
        { img: loveImages[10], caption: "每次回眸 · 皆是你" }
    ];

    // 渲染图片卡片
    const timelineContainer = document.getElementById('photoTimeline');
    function renderPhotos() {
        timelineContainer.innerHTML = '';
        photoData.forEach((item, idx) => {
            const card = document.createElement('div');
            card.className = 'memory-card';
            // 增加不同飘浮延迟
            const randomDelay = (idx % 3) * 0.5;
            card.style.animationDelay = `${randomDelay}s`;
            const img = document.createElement('img');
            img.src = item.img;
            img.alt = `恋人合照 ${idx+1}`;
            img.loading = 'lazy';
            const caption = document.createElement('div');
            caption.className = 'card-caption';
            caption.innerText = item.caption;
            card.appendChild(img);
            card.appendChild(caption);
            // 点击弹出温馨提醒
            card.addEventListener('click', () => {
                alert(`? 时光珍藏 ?\n「${item.caption}」\n愿这一刻永恒。`);
            });
            timelineContainer.appendChild(card);
        });
    }

    // 生成动态星星背景
    function createStars() {
        const starsContainer = document.getElementById('stars');
        starsContainer.innerHTML = '';
        const starCount = 280;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 3 + 1.5}s`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }
    }

    // 流光特效层生成 (动态光条 + 光粒子)
    function createFlowLights() {
        const lightsLayer = document.getElementById('flowingLights');
        lightsLayer.innerHTML = '';
        // 流光线条 (10~15条)
        const lineCount = 18;
        for (let i = 0; i < lineCount; i++) {
            const beam = document.createElement('div');
            beam.classList.add('light-beam');
            const topPos = 20 + Math.random() * 60; // 河流区域垂直位置 %
            beam.style.top = `${topPos}%`;
            const widthSize = 120 + Math.random() * 200;
            beam.style.width = `${widthSize}px`;
            beam.style.height = `${2 + Math.random() * 4}px`;
            beam.style.filter = `blur(${2 + Math.random() * 4}px)`;
            beam.style.background = `linear-gradient(90deg, 
                rgba(255,200,100,0) 0%,
                rgba(255,220,120,0.7) 20%,
                rgba(255,255,200,0.9) 50%,
                rgba(255,200,100,0.6) 80%,
                rgba(255,200,100,0) 100%)`;
            const duration = 5 + Math.random() * 6;
            beam.style.animationDuration = `${duration}s`;
            beam.style.animationDelay = `${Math.random() * 5}s`;
            lightsLayer.appendChild(beam);
        }

        // 添加漂浮光粒子 (增加流动感)
        const particleCount = 80;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('glow-particle');
            const topPos = 15 + Math.random() * 70;
            particle.style.top = `${topPos}%`;
            particle.style.left = `${Math.random() * 100}%`;
            const size = 3 + Math.random() * 8;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.background = `radial-gradient(circle, #ffdd99, #ffaa66)`;
            const duration = 3 + Math.random() * 6;
            particle.style.animationDuration = `${duration}s`;
            particle.style.animationDelay = `${Math.random() * 4}s`;
            lightsLayer.appendChild(particle);
        }
    }

    // 让河流容器宽度根据照片数量动态撑开（已由flex自动撑开，但为了保证长河效果，添加额外内边距）
    function adjustRiverLength() {
        // 由于 .photo-timeline 内部卡片数量多，flex-wrap: nowrap 自然产生长宽度，无需额外操作
        // 确保滚动条流畅
        const scrollDiv = document.getElementById('riverScroll');
        if (scrollDiv) {
            // 可选：增加平滑滚动体验
            scrollDiv.style.scrollBehavior = 'smooth';
        }
    }

    // 自动滚动指示 (可选，不加自动滚动，但为了增强流动感，可在页面加载后稍微向右偏移一点？不需要)
    // 但为了增加“河水流动”的视觉暗示，可让容器在首次加载时显示中间偏左位置，展示一部分
    function initScrollPosition() {
        const scrollDiv = document.getElementById('riverScroll');
        if (scrollDiv && scrollDiv.scrollWidth > scrollDiv.clientWidth) {
            // 初始滚动到 15% 位置，让右边留出一些画面
            const scrollAmount = scrollDiv.scrollWidth * 0.12;
            scrollDiv.scrollLeft = scrollAmount;
        }
    }

    // 额外动态波浪：让水面光点持续刷新
    function addDynamicWave() {
        const wavesContainer = document.querySelector('.river-waves');
        if (!wavesContainer) return;
        // 增加不断移动的亮点
        setInterval(() => {
            const highlight = document.createElement('div');
            highlight.style.position = 'absolute';
            highlight.style.bottom = '10%';
            highlight.style.left = '0%';
            highlight.style.width = '80px';
            highlight.style.height = '6px';
            highlight.style.background = 'radial-gradient(ellipse, rgba(255,255,200,0.6), transparent)';
            highlight.style.filter = 'blur(3px)';
            highlight.style.pointerEvents = 'none';
            highlight.style.animation = 'flowLight 3s linear forwards';
            highlight.style.zIndex = '3';
            wavesContainer.appendChild(highlight);
            setTimeout(() => highlight.remove(), 3000);
        }, 1800);
    }

    // 主入口
    function init() {
        createStars();
        renderPhotos();
        createFlowLights();
        adjustRiverLength();
        setTimeout(() => {
            initScrollPosition();
        }, 200);
        addDynamicWave();

        // 监听滚动条样式优化
        const scrollEl = document.getElementById('riverScroll');
        scrollEl.addEventListener('scroll', () => {
            // 可在此增加滚动视差，不做强制
        });
    }

    init();

    // 窗口改变时，重新调整流光层位置与河流长度（无卡片改变则无需重新渲染图片）
    window.addEventListener('resize', () => {
        // 重新生成流光层，避免尺寸错位
        createFlowLights();
        // 调整滚动位置保留比例
        const scrollDiv = document.getElementById('riverScroll');
        if (scrollDiv) {
            const currentLeft = scrollDiv.scrollLeft;
            const maxLeft = scrollDiv.scrollWidth - scrollDiv.clientWidth;
            if (currentLeft > maxLeft) scrollDiv.scrollLeft = maxLeft;
        }
    });
</script>
</body>
</html>
