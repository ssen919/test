<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流星之树 · 图片影集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #0a0f2a, #030617);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            overflow-x: hidden;
        }
        /* 大树容器 */
        .tree {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 50px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        /* 树干 */
        .trunk {
            width: 80px;
            height: 200px;
            background: linear-gradient(90deg, #5d3a1a, #3e2a14);
            border-radius: 40px 40px 10px 10px;
            margin-top: -20px;
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        /* 树冠（叶子网格） */
        .canopy {
            position: relative;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px 60px;
            padding: 40px 20px;
            background: radial-gradient(ellipse at center, rgba(30,50,20,0.3), transparent);
            border-radius: 50%;
        }
        /* 每片叶子卡片 */
        .leaf {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            /* 默认半透明，等待闪烁 */
            opacity: 0.4;
            filter: brightness(0.8);
            box-shadow: 0 0 15px rgba(255,215,0,0.2);
        }
        .leaf img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: all 0.3s;
        }
        /* 流星闪烁动画 —— 划过 + 高亮 */
        @keyframes meteorFlash {
            0% {
                opacity: 0.3;
                transform: scale(0.9) rotate(0deg);
                box-shadow: 0 0 0px gold;
                filter: brightness(0.8);
            }
            20% {
                opacity: 1;
                transform: scale(1.1) rotate(3deg);
                box-shadow: 0 0 30px 10px rgba(255,215,0,0.9), 0 0 60px 20px rgba(255,100,0,0.6);
                filter: brightness(1.5);
            }
            60% {
                opacity: 0.9;
                transform: scale(1.05) rotate(-2deg);
                box-shadow: 0 0 20px 5px rgba(255,200,0,0.7);
                filter: brightness(1.2);
            }
            100% {
                opacity: 0.4;
                transform: scale(0.95) rotate(0deg);
                box-shadow: 0 0 5px gold;
                filter: brightness(0.8);
            }
        }
        /* 每个叶子独立动画时间及延迟，由JS动态生成 */
        .leaf {
            animation-name: meteorFlash;
            animation-iteration-count: infinite;
            animation-fill-mode: both;
        }
        /* 悬停效果 */
        .leaf:hover {
            transform: scale(1.08);
            z-index: 10;
            opacity: 1 !important;
            filter: brightness(1.2);
            transition: all 0.2s;
        }
        /* 标题说明 */
        .title {
            text-align: center;
            color: #ffecb3;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ffaa33;
            letter-spacing: 4px;
        }
        .sub {
            text-align: center;
            color: #ccaa77;
            margin-top: 20px;
            font-style: italic;
        }
        @media (max-width: 700px) {
            .leaf { width: 100px; height: 100px; }
            .canopy { gap: 20px; }
        }
    </style>
</head>
<body>
<div class="tree">
    <div class="title">✨ 流星之树 · 图片影集 ✨</div>
    <div class="canopy" id="canopy">
        <!-- 图片叶子会由js动态插入 -->
    </div>
    <div class="trunk"></div>
    <div class="sub">每片叶子都是一颗流星，闪烁时展示珍藏</div>
</div>

<script>
    // ========================
    // 在这里替换成你自己的图片链接
    // 建议使用你网站中已有的图片，或图床url
    // ========================
    const imageUrls = [
        "https://picsum.photos/id/1015/200/200",   // 风景
        "https://picsum.photos/id/104/200/200",   // 小鹿
        "https://picsum.photos/id/107/200/200",   // 花草
        "https://picsum.photos/id/116/200/200",   // 山湖
        "https://picsum.photos/id/155/200/200",   // 极光
        "https://picsum.photos/id/169/200/200",   // 日出
        "https://picsum.photos/id/20/200/200",    // 咖啡
        "https://picsum.photos/id/26/200/200",    // 威尼斯
        "https://picsum.photos/id/29/200/200",    // 建筑
        "https://picsum.photos/id/33/200/200",    // 码头
        "https://picsum.photos/id/42/200/200",    // 钢琴
        "https://picsum.photos/id/59/200/200",    // 宝石
        "https://picsum.photos/id/96/200/200",    // 山道
        "https://picsum.photos/id/100/200/200",   // 相机
        "https://picsum.photos/id/119/200/200"    // 山水
    ];
    // 如果你希望使用自己网站里的图片，可以改成相对路径或绝对路径：
    // 例如: "./images/photo1.jpg"

    // 获取容器
    const canopy = document.getElementById('canopy');

    // 清空并动态生成叶子
    function generateTree() {
        canopy.innerHTML = '';
        imageUrls.forEach((url, index) => {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            // 可选：加一个自定义属性记录闪烁次数（为了趣味）
            leaf.setAttribute('data-id', index);
            const img = document.createElement('img');
            img.src = url;
            img.alt = `leaf-${index}`;
            leaf.appendChild(img);
            
            // ========= 核心：随机闪烁节奏 ==========
            // 每片叶子的动画时长在 1.5s ~ 3.5s 之间随机
            const duration = (Math.random() * 2 + 1.5).toFixed(2);
            // 动画延迟在 0s ~ 5s 之间随机，让闪烁不同步
            const delay = (Math.random() * 5).toFixed(2);
            leaf.style.animationDuration = `${duration}s`;
            leaf.style.animationDelay = `${delay}s`;
            
            // 附加一点随机初始旋转，更自然
            const rot = (Math.random() * 10 - 5).toFixed(1);
            leaf.style.transform = `rotate(${rot}deg)`;
            
            // 可选：鼠标点击时显示大图提示（简单alert，或可改成lightbox）
            leaf.addEventListener('click', () => {
                alert(`✨ 流星划过，留下回忆 ✨\n图片：${url}`);
                // 你也可以改成打开大图模态框
            });
            
            canopy.appendChild(leaf);
        });
    }

    // 执行生成
    generateTree();

    // 如果窗口大小改变，重新计算布局不需要，但可以保持响应式
    window.addEventListener('resize', () => {
        // 什么都不做，保留css处理
    });
</script>
</body>
</html>
